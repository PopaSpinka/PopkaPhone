<meta charset="utf-8">
<title>Макет НаомиФона</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Интерактивный макет интерфейса НаомиФона в духе Android 17 и Material 3 Expressive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght,ROND@6..144,25..151,1..1000,0..100&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<link rel="stylesheet" href="css/page.css">
<link rel="stylesheet" href="css/phone.css">

<div class="app">
  <main class="stage" id="stage" aria-label="Телефон">
    <div class="device-wrap" id="deviceWrap">
      <div class="device" id="device">
        <div class="screen" id="screen">
          <div class="wallpaper" id="wallpaper"></div>
          <div class="world" id="world">
            <div class="home" id="home"></div>
            <div class="home-scrim" id="homeScrim"></div>
            <div class="drawer" id="drawer"></div>
            <div class="recents-bg" id="recentsBg"></div>
            <div class="windows" id="windows"></div>
            <div class="recents-ui" id="recentsUi"></div>
          </div>
          <div class="lock" id="lock"></div>
          <div class="statusbar" id="statusbar"></div>
          <div class="privacy" id="privacy"><span class="ms">photo_camera</span></div>
          <div class="shade" id="shade"></div>
          <div class="volpanel" id="volPanel"></div>
          <div class="navbar" id="navbar"></div>
          <div class="backarrow" id="backArrow"><span class="ms">chevron_left</span></div>
          <div class="toast" id="toast" role="status"></div>
          <div class="dim" id="dim"></div>
          <div class="night" id="night"></div>
          <div class="screen-off" id="screenOff"></div>
          <div class="punch"></div>
          <div class="touch" id="touchDot"></div>
        </div>
        <button class="hw hw-power" id="hwPower" title="Питание" aria-label="Питание"></button>
        <button class="hw hw-volup" id="hwVolUp" title="Громче" aria-label="Громче"></button>
        <button class="hw hw-voldown" id="hwVolDown" title="Тише" aria-label="Тише"></button>
      </div>
    </div>
  </main>
  <aside class="panel" id="panel" aria-label="Пульт"></aside>
</div>

<script src="js/motion.js"></script>
<script src="js/theme.js"></script>
<script src="js/apps.js"></script>
<script src="js/shell.js"></script>
<script src="js/panel.js"></script>
<script>
  document.getElementById('hwPower').addEventListener('click', () => Shell.power());
  document.getElementById('hwVolUp').addEventListener('click', () => Shell.showVolume(1 / 15));
  document.getElementById('hwVolDown').addEventListener('click', () => Shell.showVolume(-1 / 15));
</script>
